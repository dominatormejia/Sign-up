<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in Page</title>
    <link rel="stylesheet" href="style.css" />
    <style src="javacript.js" defer></style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Sign Up</h1>
      <form>
        <div>
          <label for="email-input"> @ </label>
          <input
            type="email"
            name="email"
            id="email-input"
            placeholder="Email"
          />
        </div>
        <div>
          <label for="password-input">
            <img
              src="svgs/lock_24dp_E3E3E3_FILL1_wght400_GRAD0_opsz24.svg"
              alt=""
            />
          </label>
          <input
            type="password"
            name="password"
            id="password-input"
            placeholder="Password"
          />
        </div>
        <button>Log In</button>
      </form>
      <p>Need to Make an Account? <a href="sign-up.html">Sign up</a></p>
    </div>
  </body>
</html>
