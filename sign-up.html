<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up Page</title>
    <link rel="stylesheet" href="style.css" />
    <style src="javacript.js" defer></style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Sign Up</h1>
      <form>
        <div>
          <label for="firstName-input">
            <img
              src="svgs/person_24dp_E3E3E3_FILL1_wght400_GRAD0_opsz24.svg"
              alt=""
          /></label>
          <input
            type="text"
            name="firstName"
            id="firstName-input"
            placeholder="First Name"
          />
        </div>
        <div>
          <label for="email-input"> @ </label>
          <input
            type="email"
            name="email"
            id="email-input"
            placeholder="Email"
          />
        </div>
        <div>
          <label for="password-input">
            <img
              src="svgs/lock_24dp_E3E3E3_FILL1_wght400_GRAD0_opsz24.svg"
              alt=""
            />
          </label>
          <input
            type="password"
            name="password"
            id="password-input"
            placeholder="Password"
          />
        </div>
        <div>
          <label for="repeat-password-input">
            <img
              src="svgs/lock_24dp_E3E3E3_FILL1_wght400_GRAD0_opsz24.svg"
              alt=""
            />
          </label>

          <input
            type="password"
            name="repeat-password"
            id="repeat-password-input"
            placeholder="Repeat Password"
          />
        </div>
        <button>Sign Up</button>
      </form>
      <p>Already have an account? <a href="log-in.html">Log in</a></p>
    </div>
  </body>
</html>
